use_default_settings: true

general:
  debug: false
  instance_name: "Local AI Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false
  open_metrics: ''

search:
  safe_search: 1
  autocomplete: ''
  default_lang: auto
  formats:
    - html
    - json

server:
  port: 8082
  bind_address: "127.0.0.1"
  base_url: false
  limiter: false
  public_instance: false
  # This is overridden by SEARXNG_SECRET from .env at startup.
  secret_key: "configured-by-environment"
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

valkey:
  url: false

ui:
  query_in_title: false
  default_theme: simple
  default_locale: ""

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  useragent_suffix: ""
  pool_connections: 20
  pool_maxsize: 5
  enable_http2: true
